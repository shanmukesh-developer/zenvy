databases:
  - name: hostelbites-db
    databaseName: hostelbites
    user: hostelbites_user
    plan: starter # Starter plan includes daily backups and allows connection pooling (PgBouncer)

services:
  # 1. Backend API (PostgreSQL)
  - type: web
    name: hostelbites-backend
    env: node
    # Standard = 1 dedicated CPU / 2 GB. Stay at ONE instance until the Redis layer (B1) is verified in
    # production; then scale to 2 in the dashboard (Settings -> Scaling) or set numInstances: 2.
    plan: standard
    numInstances: 1
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    # Traffic goes only to an instance whose startup finished, whose database answers and that is not
    # shutting down (backend/utils/lifecycle.js). /livez = process up (no DB), /api/health unchanged.
    healthCheckPath: /readyz
    # SIGTERM -> graceful drain (backend SHUTDOWN_TIMEOUT_MS, default 25 s) well before Render's SIGKILL.
    maxShutdownDelaySeconds: 45
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hostelbites-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # B1: shared state for 2+ instances (socket.io Redis adapter, cache invalidation, rate limits).
      # Set in the Render dashboard only (redis:// or rediss://); unset = single-instance behaviour.
      - key: REDIS_URL
        sync: false
      # In production the Redis layer also needs REDIS_ENABLED=true (set it in the dashboard when going
      # to 2 instances); without it a saved REDIS_URL stays dormant.
      - key: REDIS_ENABLED
        sync: false
      - key: NODE_ENV
        value: production
      - key: RENDER_EXTERNAL_URL
        value: https://hostelbites-backend-jwmt.onrender.com

  # 2. Admin Dashboard (SSR)
  - type: web
    name: hostelbites-admin
    env: node
    plan: starter
    rootDir: admin-dashboard
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://hostelbites-backend-jwmt.onrender.com
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://hostelbites-backend-jwmt.onrender.com

